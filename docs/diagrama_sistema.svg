<svg width="900" height="660" viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Arquitectura distribuida del sistema PFO3</title>
<desc>Clientes móviles y web envían tareas a un balanceador de carga, que las distribuye a un pool de servidores worker con hilos; los workers se comunican mediante una cola de mensajes y guardan los resultados en un almacenamiento distribuido.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="900" height="660" fill="#ffffff"/>

<!-- Clientes -->
<rect x="120" y="40" width="200" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="220" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Clientes móviles</text>
<text x="220" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">App en el dispositivo</text>

<rect x="580" y="40" width="200" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="680" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Clientes web</text>
<text x="680" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Navegador / cliente.py</text>

<!-- Balanceador -->
<rect x="300" y="150" width="300" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="450" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0C447C">Balanceador de carga</text>
<text x="450" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Nginx / HAProxy</text>

<line x1="220" y1="100" x2="410" y2="150" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="680" y1="100" x2="490" y2="150" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Workers -->
<rect x="110" y="260" width="200" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="210" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Worker 1</text>
<text x="210" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Pool de hilos</text>

<rect x="350" y="260" width="200" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Worker 2</text>
<text x="450" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Pool de hilos</text>

<rect x="590" y="260" width="200" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="690" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Worker 3</text>
<text x="690" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Pool de hilos</text>

<line x1="390" y1="210" x2="230" y2="260" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="450" y1="210" x2="450" y2="260" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="510" y1="210" x2="670" y2="260" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Cola de mensajes -->
<rect x="110" y="390" width="680" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="450" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">Cola de mensajes</text>
<text x="450" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">RabbitMQ — comunicación entre workers</text>

<line x1="210" y1="330" x2="210" y2="390" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="450" y1="330" x2="450" y2="390" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="690" y1="330" x2="690" y2="390" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<!-- Almacenamiento distribuido -->
<rect x="190" y="520" width="220" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="300" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#412402">PostgreSQL</text>
<text x="300" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#633806">Datos estructurados</text>

<rect x="490" y="520" width="220" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="600" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#412402">S3</text>
<text x="600" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#633806">Archivos / objetos</text>

<line x1="300" y1="460" x2="300" y2="520" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="600" y1="460" x2="600" y2="520" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Leyenda -->
<text x="450" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Implementación de este repositorio: workers como procesos separados conectados por socket (worker.py), cada uno con su pool de hilos.</text>
<text x="450" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Simulados: cola en memoria (queue.Queue) en lugar de RabbitMQ y SQLite en lugar de PostgreSQL/S3. Ver README.md.</text>
</svg>
